<body>
<main>
  <h1>Notes</h1>
  <div id="notes"></div>
</main>
<script type="module">
  import { site, escapeHtml } from "/assets/js/site.js";
  const e = escapeHtml;
  const el = document.getElementById("notes");
  if (!site.notes.length) {
    el.innerHTML = `<p class="muted">Nothing here yet. Short write-ups will appear as they are written.</p>`;
  } else {
    el.innerHTML = site.notes.map(n => `<article class="panel panel--flat"><div class="pixel small muted">${e(n.date)}</div><h3>${e(n.title)}</h3>${String(n.text).split("\n\n").map(p => `<p>${e(p)}</p>`).join("")}</article>`).join("");
  }
</script>
