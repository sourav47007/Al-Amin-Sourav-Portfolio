<meta name="description" content="Bio, experience, education, competitions and leadership.">
<meta property="og:type" content="profile">
<meta property="og:title" content="About · Md. Al-Amin Rahman Sourav">
<meta property="og:description" content="Bio, experience, education, competitions and leadership.">
<meta property="og:url" content="https://al-amin-sourav-portfolio.vercel.app/about">
<meta property="og:image" content="https://al-amin-sourav-portfolio.vercel.app/og/home.png">
<meta property="og:image:width" content="1200">

<!-- meta:end -->
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<main>
  <h1>About</h1>
  <div data-site="bio"></div>

  <h2>Experience</h2>
  <ol class="timeline" id="experience"></ol>

  <h2>Education</h2>
  <ul id="education"></ul>

  <h2>Skills</h2>
  <p id="skills"></p>

  <h2>Competitions</h2>
  <ul id="competitions"></ul>

  <h2>Leadership</h2>
  <ul id="leadership"></ul>

  <p class="btn-row"><a class="btn btn--primary" data-site="cvFile" data-attr="href" href="#" download>Download CV (PDF)</a></p>
</main>
<script type="module">
  import { site, escapeHtml } from "/assets/js/site.js";
  const e = escapeHtml;
  document.getElementById("experience").innerHTML = site.experience.map(x => `
    <li><div class="when">${e(x.from)} – ${e(x.to)}</div><h3>${e(x.role)}</h3><div class="pixel small muted">${e(x.org)}</div>
      <ul>${x.points.map(p => `<li>${e(p)}</li>`).join("")}</ul></li>`).join("");
  document.getElementById("education").innerHTML = site.education.map(x => `<li><b>${e(x.degree)}</b>, ${e(x.org)}, ${e(x.year)}</li>`).join("");
  document.getElementById("skills").innerHTML = site.skills.map(s => `<span class="tag">${e(s)}</span>`).join(" ");
  document.getElementById("competitions").innerHTML = site.competitions.map(s => `<li>${e(s)}</li>`).join("");
  document.getElementById("leadership").innerHTML = site.leadership.map(x => `<li><b>${e(x.role)}</b>, ${e(x.org)} <span class="pixel small muted">${e(x.years)}</span></li>`).join("");
</script>
</body>
</html>
